ollama:
  host: http://localhost:11434
  model: gemma4

audio:
  sample_rate: 16000
  channels: 1
  max_recording_seconds: 15
  frame_ms: 80
  silence_timeout_ms: 1000
  silence_threshold: 0.02

wakeword:
  model: hey_jarvis
  threshold: 0.5
  activation_delay_ms: 200

stt:
  model: small
  device: cpu
  compute_type: int8
  language: en
  vad_filter: true

tts:
  language: en-us
  voice: af_heart
  speed: 1.0
  min_chunk_characters: 20

tools:
  max_rounds: 5  # max LLM<->tool round-trips per user turn before giving up

search:
  searxng_url: http://localhost:8080
  timeout_seconds: 5
  fetch_results: 10   # raw results considered before dedup/normalization
  max_results: 5       # results kept after normalization, sent to the LLM
  cache_ttl_seconds: 900
  language: en
  safesearch: 1
  max_searches_per_request: 3  # per-user-turn search budget, guards against agent loops
  freshness_ttl_seconds:        # cache TTL per freshness hint; "realtime" bypasses cache
    static: 86400   # 24h
    normal: 3600    # 1h
    recent: 600     # 10m
    realtime: 0     # never cached

page_fetch:
  timeout_seconds: 10
  max_redirects: 5
  max_response_bytes: 5000000   # 5 MB raw HTTP response cap
  max_content_chars: 40000      # extracted-text cap sent to the LLM
  cache_ttl_seconds: 3600
  max_page_fetches_per_request: 3  # per-user-turn fetch_page budget, guards against agent loops

research:
  max_sources: 4              # search results fetched per research() call
  chunk_size: 4000             # characters per chunk
  chunk_overlap: 400           # characters of overlap between consecutive chunks
  max_context_chars: 12000     # total chunk-text budget sent to the LLM per call
  timeout_seconds: 10          # overall deadline for search+fetch within one research() call
  max_research_per_request: 2  # per-user-turn research budget, guards against agent loops

