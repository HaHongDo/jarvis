ollama:
  host: http://localhost:11434
  model: gemma4

audio:
  sample_rate: 16000
  channels: 1
  max_recording_seconds: 15
  frame_ms: 80
  silence_timeout_ms: 1000
  silence_threshold: 0.02

wakeword:
  model: hey_jarvis
  threshold: 0.5
  activation_delay_ms: 200

stt:
  model: small
  device: cpu
  compute_type: int8
  language: en
  vad_filter: true

tts:
  language: en-us
  voice: af_heart
  speed: 1.0
  min_chunk_characters: 20

tools:
  max_rounds: 5  # max LLM<->tool round-trips per user turn before giving up

search:
  searxng_url: http://localhost:8080
  timeout_seconds: 5
  fetch_results: 10   # raw results considered before dedup/normalization
  max_results: 5       # results kept after normalization, sent to the LLM
  cache_ttl_seconds: 900
  language: en
  safesearch: 1
