ollama:
  host: http://localhost:11434
  model: gemma4

audio:
  sample_rate: 16000
  channels: 1
  max_recording_seconds: 15
  frame_ms: 80
  silence_timeout_ms: 1000
  silence_threshold: 0.02

wakeword:
  model: hey_jarvis
  threshold: 0.5
  activation_delay_ms: 200

stt:
  model: small
  device: cpu
  compute_type: int8
  language: en
  vad_filter: true

tts:
  language: en-us
  voice: af_heart
  speed: 1.0
  min_chunk_characters: 20

tools:
  max_rounds: 5  # max LLM<->tool round-trips per user turn before giving up

search:
  searxng_url: http://localhost:8080
  timeout_seconds: 5
  fetch_results: 10   # raw results considered before dedup/normalization
  max_results: 5       # results kept after normalization, sent to the LLM
  cache_ttl_seconds: 900
  language: en
  safesearch: 1
  max_searches_per_request: 3  # per-user-turn search budget, guards against agent loops
  freshness_ttl_seconds:        # cache TTL per freshness hint; "realtime" bypasses cache
    static: 86400   # 24h
    normal: 3600    # 1h
    recent: 600     # 10m
    realtime: 0     # never cached

page_fetch:
  timeout_seconds: 10
  max_redirects: 5
  max_response_bytes: 5000000   # 5 MB raw HTTP response cap
  max_content_chars: 40000      # extracted-text cap sent to the LLM
  cache_ttl_seconds: 3600
  max_page_fetches_per_request: 3  # per-user-turn fetch_page budget, guards against agent loops

research:
  max_sources: 4              # search results fetched per research() call
  chunk_size: 4000             # characters per chunk
  chunk_overlap: 400           # characters of overlap between consecutive chunks
  max_context_chars: 12000     # total chunk-text budget sent to the LLM per call
  timeout_seconds: 10          # overall deadline for search+fetch within one research() call
  max_research_per_request: 2  # per-user-turn research budget, guards against agent loops

knowledge:
  directory: knowledge               # local notes/docs directory, relative to backend/
  db_path: knowledge.db              # sqlite vector store file, relative to backend/
  embedding_model: nomic-embed-text  # local Ollama embedding model
  chunk_size: 1200                   # characters per chunk
  chunk_overlap: 200                 # characters of overlap between consecutive chunks
  top_k: 5                           # chunks returned per search_knowledge() call
  max_context_chars: 6000            # total chunk-text budget sent to the LLM per call
  max_knowledge_searches_per_request: 3  # per-user-turn budget, guards against agent loops
  rrf_k: 60                          # Reciprocal Rank Fusion constant (see HybridRetriever)
  candidate_limit: 20                # candidates fetched per retriever before fusion

speech:
  confidence_high: 0.95              # >= this: auto-correct regardless of context
  confidence_medium: 0.75            # >= this (and below high): correct only if VocabularyContext confirms the domain
  debug_logging: false               # log RAW/MATCH/OUTPUT for every normalize() call
  llm_fallback_enabled: false        # ask the LLM to confirm/deny low-confidence matches
  llm_fallback_confidence: 0.8       # minimum LLM-reported confidence to accept a fallback correction
  vocabulary:                        # Day 14: context-aware active vocabulary
    max_active_domains: 2            # topics kept active at once (keeps the vocabulary small)
    max_prompt_terms: 24             # terms listed in the Whisper initial_prompt
    max_hotwords: 12                 # terms passed to faster-whisper hotwords
    max_recent_terms: 10             # recently-heard terms remembered for prompt ordering
    min_domain_score: 1.0            # weighted keyword score needed for a domain to count as active
    recent_seconds: 120              # 100% relevance window
    decay_seconds: 600               # 50% relevance beyond recent_seconds
    stale_seconds: 1800              # 20% relevance beyond decay_seconds; dropped after
    stt_prompt_enabled: true         # pass the active vocabulary to Whisper as initial_prompt
    stt_hotwords_enabled: true       # pass distinctive terms to faster-whisper as hotwords

